aid: lunar-outpost
name: Lunar Outpost
description: >-
  Lunar Outpost is a space robotics company founded in 2017 and headquartered in
  Golden, Colorado, with additional operations in Australia and Luxembourg. It builds
  lunar surface mobility and robotic infrastructure — the MAPP (Mobile Autonomous
  Prospecting Platform) rover, which operated at the lunar South Pole in 2025 as the
  first commercial rover on another planetary body, and the Eagle and Pegasus Lunar
  Terrain Vehicles developed for NASA's Artemis programme. Alongside the hardware it
  ships an integrated mission-operations software suite: Stargate, a spaceflight-proven
  command, control and communication platform that reached TRL 9 with 99.998% uptime on
  Lunar Voyage 1; Starweave (formerly MARS), a distributed autonomy and mesh-networking
  layer built under AFRL and AFWERX contract for coordinating heterogeneous robotic
  fleets in GPS-denied environments; and Spark, an AI mission-operations assistant.
  None of these products expose a public API, developer portal or machine-readable
  specification — Lunar Outpost sells to government and defence customers rather than
  through a self-serve developer channel. Its only public machine-readable surfaces are
  a Wix platform-generated llms.txt and an unauthenticated site MCP endpoint.
