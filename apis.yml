apis:
- aid: lunar-outpost-site-mcp
  name: Lunar Outpost Site MCP Server
  description: >-
    An unauthenticated remote Model Context Protocol server served from Lunar Outpost's
    own host and advertised by the company's llms.txt as its "Site MCP Endpoint". It
    exposes nine tools that let an agent read the company's public business details,
    search site content, and browse or call Wix platform APIs on an anonymous visitor's
    behalf. This is a Wix platform default provisioned for the marketing site — it is not
    an interface to Lunar Outpost's spaceflight or mission-control products.
  humanURL: https://www.lunaroutpost.com/llms.txt
  baseURL: https://www.lunaroutpost.com/_api/mcp
  tags:
  - MCP
  - Agents
  - Site Content
  properties:
  - type: MCPServer
    url: mcp/lunar-outpost-mcp.yml
  - type: Authentication
    url: authentication/lunar-outpost-authentication.yml
